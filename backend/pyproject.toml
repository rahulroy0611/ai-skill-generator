[build-system]
requires = ["setuptools>=61.0", "pyinstaller>=6.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-skill-generator"
version = "1.0.0"
description = "AI Skill Generator CLI - Convert PDFs to AI skills"
requires-python = ">=3.10"
dependencies = [
    "pdfplumber>=0.10.4",
    "sentence-transformers>=2.5.0",
]

[project.scripts]
ai-skill-generator = "cli:main"

[tool.pyinstaller]
name = "ai-skill-generator"
onefile = true
console = true
strip = true