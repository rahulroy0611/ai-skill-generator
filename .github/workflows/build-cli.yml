name: Build & Release CLI

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag (e.g. v1.0.0)"
        required: false
        default: "dev"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: ai-skill-generator-linux-x64
            binary: backend/dist/ai-skill-generator
          - os: windows-latest
            artifact_name: ai-skill-generator-windows-x64.exe
            binary: backend/dist/ai-skill-generator.exe

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install CPU-only PyTorch
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install dependencies
        run: pip install pyinstaller pdfplumber sentence-transformers beautifulsoup4 lxml httpx numpy

      - name: Build binary (Linux)
        if: runner.os == 'Linux'
        run: |
          cd backend
          pyinstaller \
            --onefile --console --strip \
            --name ai-skill-generator \
            --exclude-module torch.distributed \
            --exclude-module torch.testing \
            --exclude-module torchvision \
            --exclude-module torchaudio \
            cli.py

      - name: Build binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Set-Location backend
          pyinstaller --onefile --console --name ai-skill-generator `
            --exclude-module torch.distributed `
            --exclude-module torch.testing `
            --exclude-module torchvision `
            --exclude-module torchaudio `
            cli.py

      - name: Make Linux binary executable
        if: runner.os == 'Linux'
        run: chmod +x backend/dist/ai-skill-generator

      - name: Stage artifact
        shell: bash
        run: |
          mkdir -p release-artifacts
          cp "${{ matrix.binary }}" "release-artifacts/${{ matrix.artifact_name }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: release-artifacts/${{ matrix.artifact_name }}
          retention-days: 7

  release:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List files
        run: ls -lh artifacts/

      - name: Upload binaries to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.ref_name }}" \
            artifacts/ai-skill-generator-linux-x64 \
            artifacts/ai-skill-generator-windows-x64.exe \
            --repo "${{ github.repository }}" \
            --clobber
