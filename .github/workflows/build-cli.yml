name: Build CLI

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            path: "backend/dist/ai-skill-generator.exe"
          - os: ubuntu-latest
            path: "backend/dist/ai-skill-generator"

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pyinstaller pdfplumber sentence-transformers beautifulsoup4 httpx

      - name: Build CLI
        run: |
          cd backend
          pyinstaller --onefile --console --strip --name ai-skill-generator cli.py

      - name: Make Linux binary executable
        if: runner.os == 'Linux'
        run: chmod +x backend/dist/ai-skill-generator

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ runner.os }}-artifact
          path: ${{ matrix.path }}

  release:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: "*-artifact"
          path: artifacts
          merge-multiple: true

      - name: Rename artifacts
        run: |
          mv Linux-artifact ai-skill-generator-linux-x64 || true
          mv Windows-artifact ai-skill-generator-windows-x64.exe || true
          chmod +x ai-skill-generator-linux-x64
          ls -la

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ai-skill-generator-windows-x64.exe
            ai-skill-generator-linux-x64