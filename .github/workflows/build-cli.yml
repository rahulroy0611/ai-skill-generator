name: Build CLI

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            name: windows-x64
            path: "backend/dist/ai-skill-generator.exe"
            artifact: "ai-skill-generator-windows-x64.exe"
          - os: ubuntu-latest
            name: linux-x64
            path: "backend/dist/ai-skill-generator"
            artifact: "ai-skill-generator-linux-x64"

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install pyinstaller pdfplumber sentence-transformers beautifulsoup4 httpx

      - name: Build CLI
        run: |
          cd backend
          pyinstaller --onefile --console --strip --name ai-skill-generator cli.py

      - name: Make Linux binary executable
        if: matrix.name == 'linux-x64'
        run: chmod +x backend/dist/ai-skill-generator

      - name: Upload artifact
        uses: actions/upload-asset@v1
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.path }}

  release:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Display structure of downloaded files
        run: ls -R artifacts

      - name: Create Release Asset
        run: |
          cd artifacts
          for dir in */; do
            mv "$dir"*.exe ai-skill-generator-windows-x64.exe 2>/dev/null || true
            mv "$dir"ai-skill-generator ai-skill-generator-linux-x64 2>/dev/null || true
          done
          ls -la