name: Build CLI

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            path: "backend/dist/ai-skill-generator"
            name: "ai-skill-generator-linux-x64"
          - os: windows-latest
            path: "backend/dist/ai-skill-generator.exe"
            name: "ai-skill-generator-windows-x64.exe"

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pyinstaller pdfplumber sentence-transformers beautifulsoup4 httpx

      - name: Build CLI
        run: |
          cd backend
          pyinstaller --onefile --console --strip --name ai-skill-generator cli.py

      - name: Make Linux executable
        if: runner.os == 'Linux'
        run: chmod +x backend/dist/ai-skill-generator

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.path }}

  release:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: ls -la artifacts/

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/ai-skill-generator-windows-x64.exe
            artifacts/ai-skill-generator-linux-x64